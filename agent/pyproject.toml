[project]
name = "vilagent"
version = "0.1.0"
description = "VILAGENT: a Windows-first computer-use agent (local gateway + operator UI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langchain-core>=1.2.0",
    "langchain-google-genai>=4.2.1",
    "langchain-huggingface>=0.3.1",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1",
    "langgraph-checkpoint-sqlite>=3.0",
    "pillow>=11.0.0",
    "playwright>=1.40.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "pywinauto>=0.6.9",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vilagent"]
